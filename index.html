<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目 AI 看板</title>
<style>
  /* ============ 设计变量：灰阶 + 品牌蓝 + 红黄绿状态色 ============ */
  :root {
    --blue: #0052D9;          /* 品牌蓝（参考腾讯 TDesign） */
    --blue-bg: #F2F3FF;
    --green: #2BA471;
    --green-bg: #E3F9E9;
    --yellow: #E37318;
    --yellow-bg: #FCEED8;
    --red: #D54941;
    --red-bg: #FDECEE;
    --text-1: #181818;
    --text-2: #5C5C5C;
    --text-3: #8A8A8A;
    --border: #E7E9EB;
    --bg-page: #F6F7F9;
    --bg-card: #FFFFFF;
    --bg-hover: #F3F4F6;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 6px rgba(0, 0, 0, 0.03);
    --t: 200ms ease;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-1);
    background: var(--bg-page);
  }
  ::placeholder { color: var(--text-3); }

  /* ============ 顶栏 ============ */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 1280px; margin: 0 auto; padding: 12px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.2px; }
  .topbar .updated { font-size: 12px; color: var(--text-3); margin-right: auto; }
  .seg {
    display: inline-flex; background: var(--bg-hover);
    border-radius: 8px; padding: 2px;
  }
  .seg button {
    border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 12.5px; color: var(--text-2);
    padding: 4px 12px; border-radius: 6px; transition: all var(--t);
  }
  .seg button.on { background: var(--bg-card); color: var(--text-1); font-weight: 500; box-shadow: var(--shadow); }
  .search {
    width: 220px; font: inherit; font-size: 12.5px;
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
    outline: none; background: var(--bg-card); color: var(--text-1);
    transition: border-color var(--t);
  }
  .search:focus { border-color: var(--blue); }

  /* ============ 布局 ============ */
  .page { max-width: 1280px; margin: 0 auto; padding: 24px 24px 96px; }
  .section { margin-bottom: 40px; }
  .section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .section-head h2 { font-size: 14px; font-weight: 600; }
  .section-head .hint { font-size: 12px; color: var(--text-3); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 20px; transition: box-shadow var(--t), border-color var(--t);
  }
  .card:hover { border-color: #D9DCDF; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

  /* ============ 通用小组件 ============ */
  .chip {
    display: inline-block; font-size: 11.5px; line-height: 1;
    padding: 4px 8px; border-radius: 6px;
    background: var(--bg-hover); color: var(--text-2); white-space: nowrap;
  }
  .chip.blue { background: var(--blue-bg); color: var(--blue); }
  .tag-internal { background: var(--bg-hover); color: var(--text-2); }
  .tag-external { background: var(--blue-bg); color: var(--blue); }
  .muted { color: var(--text-3); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .card-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
  .card-head .name { font-size: 15px; font-weight: 600; }
  .card-head .spacer { margin-left: auto; }
  .kv { display: flex; gap: 6px; align-items: baseline; }
  .kv .k { color: var(--text-3); font-size: 12px; flex: none; }

  /* 红绿灯 */
  .lights { display: inline-flex; gap: 4px; align-items: center; }
  .lights i { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
  .lights.green .g { background: var(--green); }
  .lights.yellow .y { background: var(--yellow); }
  .lights.red .r { background: var(--red); }
  .health-label { font-size: 12px; }
  .health-label.green { color: var(--green); }
  .health-label.yellow { color: var(--yellow); }
  .health-label.red { color: var(--red); }

  /* 星级 */
  .stars { letter-spacing: 2px; font-size: 13px; }
  .stars .on { color: var(--yellow); }
  .stars .off { color: var(--border); }

  /* 文件类型徽标 */
  .fbadge {
    display: inline-block; flex: none; width: 34px; text-align: center;
    font-size: 10px; font-weight: 600; line-height: 1;
    padding: 4px 0; border-radius: 4px; letter-spacing: 0.5px;
    background: var(--bg-hover); color: var(--text-2);
  }
  .fbadge.pdf  { background: var(--red-bg); color: var(--red); }
  .fbadge.xlsx { background: var(--green-bg); color: var(--green); }
  .fbadge.docx { background: var(--blue-bg); color: var(--blue); }
  .fbadge.pptx { background: var(--yellow-bg); color: var(--yellow); }

  /* ============ 调研期卡片 ============ */
  .stage-labels { display: flex; margin-bottom: 6px; }
  .stage-labels span {
    flex: 1; text-align: center; font-size: 12px; color: var(--text-3);
    transition: color var(--t);
  }
  .stage-labels span.done { color: var(--text-2); }
  .stage-labels span.now { color: var(--blue); font-weight: 600; }
  .stage-track {
    height: 4px; border-radius: 2px; background: var(--bg-hover); overflow: hidden;
  }
  .stage-fill {
    height: 100%; width: 0; border-radius: 2px; background: var(--blue);
    transition: width 600ms ease;
  }
  .research-meta { display: flex; gap: 24px; margin: 14px 0; }
  .research-meta .num { font-weight: 600; font-variant-numeric: tabular-nums; }
  .qlist { margin: 0 0 12px; padding: 10px 12px; background: var(--bg-page); border-radius: 8px; }
  .qlist .k { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
  .qlist li { margin-left: 18px; color: var(--text-2); }

  /* ============ 里程碑时间轴 ============ */
  .timeline { display: flex; margin: 16px 0 14px; }
  .tl-step { flex: 1; position: relative; text-align: center; }
  .tl-step::before {
    content: ""; position: absolute; top: 5px; left: -50%; right: 50%;
    height: 2px; background: var(--border);
  }
  .tl-step:first-child::before { display: none; }
  .tl-step.done::before { background: var(--blue); }
  .tl-step.active::before { background: var(--blue); }
  .tl-dot {
    position: relative; z-index: 1; display: inline-block;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--border); border: 2px solid var(--bg-card);
  }
  .tl-step.done .tl-dot { background: var(--blue); }
  .tl-step.active .tl-dot { background: var(--bg-card); border-color: var(--blue); box-shadow: inset 0 0 0 2px var(--bg-card); outline: 2px solid var(--blue); outline-offset: -2px; }
  .tl-name { font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .tl-step.done .tl-name { color: var(--text-2); }
  .tl-step.active .tl-name { color: var(--blue); font-weight: 600; }
  .tl-date { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }

  .exec-rows { display: grid; gap: 8px; }
  .risk-row { padding: 8px 12px; border-radius: 8px; background: var(--bg-page); color: var(--text-2); }
  .risk-row.yellow { background: var(--yellow-bg); color: var(--yellow); }
  .risk-row.red { background: var(--red-bg); color: var(--red); }
  .files-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .activity { color: var(--text-2); }
  .activity .d { color: var(--text-3); font-size: 12px; margin-right: 6px; font-variant-numeric: tabular-nums; }

  /* ============ Log 日志区 ============ */
  .list { list-style: none; }
  .list li {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 4px; border-bottom: 1px solid var(--bg-hover);
  }
  .list li:last-child { border-bottom: 0; }
  .list .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .date { flex: none; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .list .proj { flex: none; }

  .vtl { list-style: none; position: relative; padding-left: 18px; }
  .vtl::before { content: ""; position: absolute; left: 4px; top: 8px; bottom: 8px; width: 2px; background: var(--bg-hover); }
  .vtl li { position: relative; padding: 8px 0; }
  .vtl li::before {
    content: ""; position: absolute; left: -18px; top: 15px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--bg-card); border: 2px solid var(--text-3);
  }
  .vtl li.external::before { border-color: var(--blue); }
  .vtl .t { color: var(--text-1); }
  .vtl .m { margin-top: 2px; display: flex; gap: 8px; align-items: center; }

  /* ============ 当前进度（待办） ============ */
  .todo-col h3 { font-size: 13px; font-weight: 600; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  .todo-col h3 .cnt { font-size: 12px; font-weight: 400; color: var(--text-3); }
  .todo { list-style: none; }
  .todo li {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 4px; border-bottom: 1px solid var(--bg-hover);
  }
  .todo li:last-child { border-bottom: 0; }
  .todo input[type="checkbox"] { margin-top: 4px; accent-color: var(--blue); width: 14px; height: 14px; flex: none; cursor: pointer; }
  .todo .body { flex: 1; min-width: 0; }
  .todo .meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-3); }
  .todo li.done .body { color: var(--text-3); text-decoration: line-through; }

  /* ============ 问答悬浮按钮 & 对话框 ============ */
  .qa-fab {
    position: fixed; right: 24px; bottom: 24px; z-index: 100;
    width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--blue); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(0, 82, 217, 0.3);
    transition: transform var(--t), background var(--t);
  }
  .qa-fab:hover { transform: scale(1.05); background: #0048BE; }
  .qa-panel {
    position: fixed; right: 24px; bottom: 84px; z-index: 100;
    width: 360px; max-height: 520px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    display: flex; flex-direction: column; overflow: hidden;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity var(--t), transform var(--t);
  }
  .qa-panel.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .qa-head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; }
  .qa-head .sub { font-weight: 400; font-size: 11.5px; color: var(--text-3); }
  .qa-msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: grid; gap: 10px; }
  .qa-msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.55; }
  .qa-msg.user { justify-self: end; background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
  .qa-msg.bot { justify-self: start; background: var(--bg-page); color: var(--text-1); border-bottom-left-radius: 4px; }
  .qa-input { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .qa-input input {
    flex: 1; font: inherit; font-size: 12.5px; padding: 7px 12px;
    border: 1px solid var(--border); border-radius: 8px; outline: none;
    transition: border-color var(--t);
  }
  .qa-input input:focus { border-color: var(--blue); }
  .qa-input button {
    border: 0; background: var(--blue); color: #fff; cursor: pointer;
    font: inherit; font-size: 12.5px; padding: 0 16px; border-radius: 8px;
    transition: background var(--t);
  }
  .qa-input button:hover { background: #0048BE; }

  /* ============ 报错态 ============ */
  .fatal {
    max-width: 560px; margin: 80px auto; padding: 24px;
    background: var(--red-bg); border: 1px solid var(--red);
    border-radius: var(--radius); color: var(--red); font-size: 13.5px;
  }
  .fatal b { display: block; margin-bottom: 6px; }

  /* ============ 平板降级 ============ */
  @media (max-width: 960px) {
    .grid-2 { grid-template-columns: 1fr; }
    .search { width: 160px; }
    .topbar .updated { flex-basis: 100%; order: 9; margin: 0; }
  }
</style>
</head>
<body>

<header class="topbar" id="topbar" hidden>
  <div class="topbar-inner">
    <h1 id="board-title">项目 AI 看板</h1>
    <span class="updated" id="board-updated"></span>
    <div class="seg" id="status-filter" role="tablist" aria-label="状态筛选">
      <button class="on" data-filter="all">全部</button>
      <button data-filter="research">调研中</button>
      <button data-filter="established">已立项</button>
    </div>
    <input class="search" id="search-input" type="search" placeholder="搜索项目 / 关键词">
  </div>
</header>

<main class="page" id="app"></main>

<button class="qa-fab" id="qa-fab" hidden aria-label="打开项目问答">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.2 0-2.4-.25-3.4-.7L3 21l1.7-5.1A8.5 8.5 0 1 1 21 11.5z"/>
  </svg>
</button>
<div class="qa-panel" id="qa-panel" aria-hidden="true">
  <div class="qa-head">项目问答 <span class="sub">· 示例对话，知识库问答即将接入</span></div>
  <div class="qa-msgs" id="qa-msgs"></div>
  <div class="qa-input">
    <input id="qa-text" type="text" placeholder="问我任何关于项目的问题">
    <button id="qa-send">发送</button>
  </div>
</div>

<script src="data.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fatal(msg) {
    document.getElementById("app").innerHTML =
      '<div class="fatal"><b>数据加载失败</b>' + esc(msg) +
      "<br>请确认 data.js 与 index.html 位于同一目录，且内容为 window.DASHBOARD_DATA = {...}。</div>";
  }

  var STAGES = [
    { key: "screening", label: "初筛" },
    { key: "interview", label: "访谈" },
    { key: "report", label: "报告" }
  ];
  var HEALTH = { green: "正常", yellow: "关注", red: "风险" };
  var FTYPE = { pdf: "PDF", xlsx: "XLS", docx: "DOC", pptx: "PPT" };

  function stars(n) {
    var h = "";
    for (var i = 1; i <= 5; i++) h += '<span class="' + (i <= n ? "on" : "off") + '">★</span>';
    return '<span class="stars" title="初步评级 ' + n + '/5">' + h + "</span>";
  }
  function fbadge(type) {
    var t = FTYPE[type] || String(type || "").toUpperCase().slice(0, 3);
    return '<span class="fbadge ' + esc(type) + '">' + esc(t) + "</span>";
  }
  function lights(health) {
    return '<span class="lights ' + esc(health) + '"><i class="r"></i><i class="y"></i><i class="g"></i></span>' +
      ' <span class="health-label ' + esc(health) + '">' + (HEALTH[health] || esc(health)) + "</span>";
  }
  function noteTag(type) {
    return type === "internal"
      ? '<span class="chip tag-internal">内部</span>'
      : '<span class="chip tag-external">外部</span>';
  }
  /* 关键数字：data-count 标记，渲染完成后统一做滚动动画 */
  function num(n) {
    return '<span class="num" data-count="' + (+n || 0) + '">0</span>';
  }

  /* ---------- 调研期卡片 ---------- */
  function researchCard(p) {
    var r = p.research || {};
    var idx = Math.max(0, STAGES.map(function (s) { return s.key; }).indexOf(r.stage));
    var pct = ((idx + 1) / STAGES.length) * 100;
    var labels = STAGES.map(function (s, i) {
      var cls = i < idx ? "done" : i === idx ? "now" : "";
      return '<span class="' + cls + '">' + s.label + "</span>";
    }).join("");
    var qs = (r.questions || []).map(function (q) { return "<li>" + esc(q) + "</li>"; }).join("");
    var iv = r.interviews || {};
    return '<article class="card" data-project="' + esc(p.id) + '">' +
      '<div class="card-head">' +
        '<span class="name">' + esc(p.name) + "</span>" +
        '<span class="chip blue">' + esc(p.track) + "</span>" +
        '<span class="spacer muted">更新 ' + esc(p.updatedAt) + "</span>" +
      "</div>" +
      '<div class="stage-labels">' + labels + "</div>" +
      '<div class="stage-track"><div class="stage-fill" data-fill="' + pct + '"></div></div>' +
      '<div class="research-meta">' +
        '<span class="kv"><span class="k">访谈</span>内部 ' + num(iv.internal) + " / 外部 " + num(iv.external) + "</span>" +
        '<span class="kv"><span class="k">评级</span>' + stars(+r.rating || 0) + "</span>" +
      "</div>" +
      '<div class="qlist"><div class="k">核心待验证问题</div><ul>' + qs + "</ul></div>" +
      '<div class="kv"><span class="k">下一步</span><span>' + esc(r.nextAction) + "</span></div>" +
    "</article>";
  }

  /* ---------- 已立项卡片 ---------- */
  function establishedCard(p) {
    var e = p.execution || {};
    var steps = (e.milestones || []).map(function (m) {
      return '<div class="tl-step ' + esc(m.status) + '">' +
        '<span class="tl-dot"></span>' +
        '<div class="tl-name">' + esc(m.name) + "</div>" +
        '<div class="tl-date">' + esc((m.date || "").slice(5)) + "</div>" +
      "</div>";
    }).join("");
    var todoUs = ((p.todos || {}).us || []).filter(function (t) { return !t.done; }).length;
    var todoPt = ((p.todos || {}).partner || []).filter(function (t) { return !t.done; }).length;
    var filesHtml = (p.files || []).map(function (f) {
      return '<span title="' + esc(f.name) + '">' + fbadge(f.type) + "</span>";
    }).join("");
    var act = e.latestActivity || {};
    return '<article class="card" data-project="' + esc(p.id) + '">' +
      '<div class="card-head">' +
        '<span class="name">' + esc(p.name) + "</span>" +
        '<span class="chip">' + esc(e.currentMilestone) + "</span>" +
        '<span class="spacer row">' + lights(e.health) + "</span>" +
      "</div>" +
      '<div class="timeline">' + steps + "</div>" +
      '<div class="exec-rows">' +
        '<div class="risk-row ' + (e.health === "green" ? "" : esc(e.health)) + '">风险：' + esc(e.risk || "暂无") + "</div>" +
        '<div class="row" style="gap:24px">' +
          '<span class="kv"><span class="k">待办</span>我们 ' + num(todoUs) + " / 项目方 " + num(todoPt) + "</span>" +
          '<span class="kv files-row"><span class="k">关键文件</span>' + filesHtml + "</span>" +
        "</div>" +
        '<div class="activity"><span class="d">' + esc(act.date) + "</span>" + esc(act.text) + "</div>" +
      "</div>" +
    "</article>";
  }

  /* ---------- Log 日志区 ---------- */
  function logSection(projects) {
    var files = [], notes = [];
    projects.forEach(function (p) {
      (p.files || []).forEach(function (f) { files.push({ p: p.name, f: f }); });
      (p.interviewNotes || []).forEach(function (n) { notes.push({ p: p.name, n: n }); });
    });
    files.sort(function (a, b) { return a.f.addedAt < b.f.addedAt ? 1 : -1; });
    notes.sort(function (a, b) { return a.n.date < b.n.date ? 1 : -1; });

    var fHtml = files.map(function (x) {
      return "<li>" + fbadge(x.f.type) +
        '<span class="fname" title="' + esc(x.f.name) + '">' + esc(x.f.name) + "</span>" +
        '<span class="chip proj">' + esc(x.p) + "</span>" +
        '<span class="date">' + esc(x.f.addedAt) + "</span></li>";
    }).join("");
    var nHtml = notes.map(function (x) {
      return '<li class="' + esc(x.n.type) + '"><div class="t">' + esc(x.n.title) + "</div>" +
        '<div class="m">' + noteTag(x.n.type) +
        '<span class="chip proj">' + esc(x.p) + "</span>" +
        '<span class="date muted">' + esc(x.n.date) + "</span></div></li>";
    }).join("");

    return '<section class="section">' +
      '<div class="section-head"><h2>项目日志</h2><span class="hint">新文件入库将自动更新上方展示</span></div>' +
      '<div class="grid-2">' +
        '<div class="card"><div class="section-head"><h2>项目文件</h2></div><ul class="list">' + fHtml + "</ul></div>" +
        '<div class="card"><div class="section-head"><h2>访谈纪要</h2></div><ul class="vtl">' + nHtml + "</ul></div>" +
      "</div></section>";
  }

  /* ---------- 当前进度（双栏待办） ---------- */
  function todoSection(projects) {
    function collect(side) {
      var items = [];
      projects.forEach(function (p) {
        ((p.todos || {})[side] || []).forEach(function (t) { items.push({ p: p.name, t: t }); });
      });
      items.sort(function (a, b) { return a.t.due < b.t.due ? -1 : 1; });
      return items;
    }
    function col(title, items) {
      var open = items.filter(function (x) { return !x.t.done; }).length;
      var html = items.map(function (x) {
        return '<li class="' + (x.t.done ? "done" : "") + '">' +
          '<input type="checkbox"' + (x.t.done ? " checked" : "") + ">" +
          '<div class="body"><div>' + esc(x.t.task) + "</div>" +
          '<div class="meta"><span class="chip proj">' + esc(x.p) + "</span>" +
          "<span>负责人 " + esc(x.t.owner) + "</span><span>截止 " + esc(x.t.due) + "</span></div></div></li>";
      }).join("");
      return '<div class="card todo-col"><h3>' + title +
        '<span class="cnt">未完成 ' + open + " 项</span></h3><ul class=\"todo\">" + html + "</ul></div>";
    }
    return '<section class="section">' +
      '<div class="section-head"><h2>当前进度</h2><span class="hint">双方待办事项</span></div>' +
      '<div class="grid-2">' + col("我们", collect("us")) + col("项目方", collect("partner")) + "</div></section>";
  }

  /* ---------- 问答对话框 ---------- */
  function initQA(qa) {
    var fab = document.getElementById("qa-fab");
    var panel = document.getElementById("qa-panel");
    var msgs = document.getElementById("qa-msgs");
    fab.hidden = false;
    var html = "";
    ((qa || {}).examples || []).forEach(function (ex) {
      html += '<div class="qa-msg user">' + esc(ex.q) + "</div>" +
              '<div class="qa-msg bot">' + esc(ex.a) + "</div>";
    });
    msgs.innerHTML = html;
    fab.addEventListener("click", function () {
      var open = panel.classList.toggle("open");
      panel.setAttribute("aria-hidden", String(!open));
      if (open) msgs.scrollTop = msgs.scrollHeight;
    });
    document.getElementById("qa-send").addEventListener("click", function () {
      var input = document.getElementById("qa-text");
      if (input.value.trim()) sendToBot(input.value.trim());
    });
  }

  /**
   * 预留：知识库问答接口。
   * 未来在此处将 question 发送至后端知识库问答服务，
   * 并把返回的答案追加渲染到 #qa-msgs 对话流中。
   * 当前为空实现，仅占位。
   */
  function sendToBot(question) {
    // TODO: 接入知识库问答
  }

  /* ---------- 加载动画：进度条填充 + 数字滚动 ---------- */
  function runLoadAnimations() {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        document.querySelectorAll(".stage-fill").forEach(function (el) {
          el.style.width = el.getAttribute("data-fill") + "%";
        });
      });
    });
    document.querySelectorAll(".num[data-count]").forEach(function (el) {
      var target = +el.getAttribute("data-count") || 0;
      var start = null, dur = 600;
      function tick(ts) {
        if (start === null) start = ts;
        var t = Math.min(1, (ts - start) / dur);
        var eased = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.round(target * eased);
        if (t < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  /* ---------- 主渲染 ---------- */
  function render(data) {
    document.getElementById("topbar").hidden = false;
    document.getElementById("board-title").textContent = data.meta.title || "项目 AI 看板";
    document.getElementById("board-updated").textContent = "最后更新 " + (data.meta.updatedAt || "—");
    document.title = data.meta.title || "项目 AI 看板";

    var projects = data.projects;
    var research = projects.filter(function (p) { return p.status === "research"; });
    var established = projects.filter(function (p) { return p.status === "established"; });

    var html =
      '<section class="section" id="group-research">' +
        '<div class="section-head"><h2>调研中</h2><span class="hint">' + research.length + " 个项目</span></div>" +
        '<div class="grid-2">' + research.map(researchCard).join("") + "</div></section>" +
      '<section class="section" id="group-established">' +
        '<div class="section-head"><h2>已立项</h2><span class="hint">' + established.length + " 个项目</span></div>" +
        '<div class="grid-2">' + established.map(establishedCard).join("") + "</div></section>" +
      logSection(projects) +
      todoSection(projects);

    document.getElementById("app").innerHTML = html;
    initQA(data.qa);
    runLoadAnimations();
  }

  /* ---------- 入口（数据缺失/异常时给出明确报错，不白屏） ---------- */
  var data = window.DASHBOARD_DATA;
  if (!data || typeof data !== "object") {
    fatal("未找到 window.DASHBOARD_DATA，data.js 可能缺失或未正确加载。");
    return;
  }
  if (!data.meta || !Array.isArray(data.projects)) {
    fatal("数据格式不正确：缺少 meta 或 projects 字段。");
    return;
  }
  try {
    render(data);
  } catch (err) {
    fatal("渲染出错：" + (err && err.message ? err.message : err));
  }
})();
</script>
